<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="assets/fonts/remixicon.css">
    <link rel="stylesheet" href="assets/fonts/remixicon.css">
    <link rel="stylesheet" href="css/style.css">

</head>
<body>
    <h1 class="centro">Anunciar Produto</h1>
    <div class="columnpadrao">
        <div class="rowpadrao">
            <div class="columnpadrao">
                <img src="img/placeholder.png" alt="" style="max-width: 800px;">
                <lista-de-fotos 
                fotos='["img/placeholder.png", "img/placeholder.png"]'></lista-de-fotos>
            </div>
            <div class="addfoto">
                <i class="ri-add-circle-line" style="font-size: 120px;"></i>
                Adicionar foto ou vídeo
            </div>
        </div>
        <div class="columnpadrao">
            <textarea wrap="off" rows="1" id="nomeNovo" placeholder="Nome do Produto" class="textfieldprodutos"></textarea>
            <select id="tipoNovo" class="textfieldprodutos" style="padding: 10px; margin-bottom: 5px;">
                <option value="Barco">Barco</option>
                <option value="Peça">Peça</option>
                <option value="Acessorio">Acessório</option>
            </select>
            <textarea wrap="off" rows="1" id="precoNovo" placeholder="Preço" class="textfieldprodutos"></textarea>
            <textarea wrap="off" rows="1" id="cepNovo" placeholder="CEP de busca" class="textfieldprodutos"></textarea>
            <textarea wrap="off" rows="1" id="qtdNovo" placeholder="Quantidade" class="textfieldprodutos"></textarea>
            <textarea id="descricaoNovo" placeholder="Descrição" class="campodescricao"></textarea>
            
            <button onclick="adicionarAnuncio()" style="padding: 15px; font-size: 16px; cursor: pointer; background: #000; color: #fff; border-radius: 8px;">Publicar Anúncio</button>
        </div>
    </div>
    <script src="js/scriptwidgets.js"></script>
</body>
</html>
