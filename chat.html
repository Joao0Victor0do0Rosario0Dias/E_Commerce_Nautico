<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="assets/fonts/remixicon.css">
    <style>
        html, body{
            margin: 0%;
            font-family: Arial, Helvetica, sans-serif;
            overflow: hidden;    
            height: 100vh;

        }
        header{
            display: flex;
            height: 75px;
            background-color:rgb(189, 194, 199);
            width: 100%;
            flex-direction: row;
            gap: 25px;
            text-align: center;

        }
        a{
            text-decoration: none;
            font-size: 50px;
            color: black;
            margin-top: auto;
            margin-bottom: auto;
            margin-left: 15px;
        }
        .column{
            display: flex;
            justify-content: space-between;
            flex-direction: column;
            height:100%
        }
        .tabmensagem{
            background-color: rgb(189, 194, 199);
            width: 100%;
            height: 80px;
            flex-shrink: 0;
        }
        .mensagens{
            width: 100%;
            flex: 1;
            overflow-y: auto;
        }
        .rowpadrao{
            display: flex;
            flex-direction: row;
            justify-content: space-around;
            align-items: center;
            text-align: center;
            margin-top: 5px;
        }
        textarea{
            margin-left: 15px;
            display: flex;
            flex: 1;
            width: 100%;
        }
        i{
            flex-shrink: 0;
            font-size: 40px;
            margin: 5px;
        }
    </style>
</head>
<body>

    <div class="column">
        <header>
            <a href="index.html"> &lt </a><h1>Chat com vendedor</h1>
        </header>
        <div class="mensagens"></div>
        <div class="tabmensagem">
            <div class="rowpadrao">
                <textarea name="" id=""></textarea>
                <i class="ri-send-plane-fill"></i>
            </div>
        </div>
    </div>
</body>
</html>
