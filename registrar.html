<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar</title>
    <link rel="icon" type="image/png" href="img/logo.png">
    <link rel="stylesheet" href="css/entrar_registrar.css">
</head>
<body>
    <header>Registrar</header>
    <main>
        <form action="registrar" id="registrar">
            <label for="email">E-mail</label><br>
            <input type="text" id="email" name="email"><br>
            <label for="senha">Senha</label>
            <input type="password" id="senha" minlength="8" maxlength="63" name="senha">
            <br>
            <label for="confirmacaosenha">Digite a senha novamente</label>
            <input type="password" id="confirmacaosenha" name="confirmacaosenha"><br>
            <div class="row">
                <p>Mostrar senha:</p>
                <input type="checkbox" id="mostrarsenha">
            </div>
            <div class="entrar" href="./index.html" id="btnregistrar">Registrar</div>
        </form>

        <a href="entrar.html">Já possui conta, entrar</a>
      
        <script src="js/script.js"></script>
    </main>
    
</body>
</html>
