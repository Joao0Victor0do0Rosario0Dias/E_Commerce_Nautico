<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar</title>
    <link rel="icon" type="image/png" href="img/logo.png">
    <link rel="stylesheet" href="css/entrar_registrar.css">
</head>
<body>
    <header>Registrar</header>
    <main>
        <form id="registrar">
            <label for="email">E-mail</label><br>
            <input type="email" id="email" name="email" required><br>
                
            <label for="senha">Senha</label>
            <input type="password" id="senha" minlength="6" maxlength="63" name="senha" required>
            <br>
                
            <label for="confirmacaosenha">Digite a senha novamente</label>
            <input type="password" id="confirmacaosenha" minlength="6" maxlength="63" name="confirmacaosenha" required><br>
                
            <div class="row">
                <p>Mostrar senha:</p>
                <input type="checkbox" id="mostrarsenha">
            </div>
            
            <button type="submit" class="entrar" id="btnregistrar" style="cursor: pointer; border: none;">Registrar</button>
        </form>

        <a href="entrar.html">Já possui conta, entrar</a>
      
        <script src="js/script.js"></script>
    </main>
    
</body>
</html>
